   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5f746d" x="32.4" y="32.4" transform="rotate(-0 32.4 32.4)">LIFE SCIENCES BENCHMARK  /  SCORING PROTOCOL</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="32.4" y="74.88" transform="rotate(-0 32.4 74.88)">Same answers. Two preserved rounds.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5f746d" x="32.4" y="104.4" transform="rotate(-0 32.4 104.4)">Strict-v2.0 · owner-requested post-hoc rescore · one independent answer per question</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="54" y="174.077813" transform="rotate(-0 54 174.077813)">01  Verify the saved record</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 208.0505)">Candidate hash + question + evidence + reference</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 224.8505)">Unavailable requests remain missing. Refusals are retained.</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="54" y="314.477813" transform="rotate(-0 54 314.477813)">02  Preserve round one</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 348.4505)">Finish all available reviews; archive original scores,</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 365.2505)">matching evidence and hashes. Never overwrite them.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="54" y="454.877813" transform="rotate(-0 54 454.877813)">03  Freeze before rescoring</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 488.8505)">Publish criteria, applicability and non-duplication rules.</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 505.6505)">Record rubric hash and disclose the post-hoc change.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="54" y="595.277812" transform="rotate(-0 54 595.277812)">04  Read and judge again</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 629.2505)">Personally read the complete final answer. Record exact</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 646.0505)">evidence, absent requirements and reference corrections.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="54" y="735.677812" transform="rotate(-0 54 735.677812)">05  Save a separate second-round review</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 770.076625)">Q2 = max(0, 100 − distinct deductions)</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 786.4505)">Retain raw quality, five match components and explanation</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(54 803.2505)">quality. Keep the original candidate and round one intact.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="532.8" y="174.077812" transform="rotate(-0 532.8 174.077812)">The strict checklist</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 208.0505)">−10  Control verification + prospective design¹</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 224.8505)">−10  Prior Methods / protocol consultation plan</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 241.6505)"> −5  Each applicable scientific or execution check</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 255.36)"/>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 275.69325)">Quantities · calibration · inference · failure / iteration</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 292.0505)">Tool assumptions · parameters · independent validation</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 308.8505)">One underlying defect is charged once.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="532.8" y="440.477813" transform="rotate(-0 532.8 440.477813)">The research-direction gate</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 474.89325)">Question → mechanism → intervention → readout</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 491.2505)">→ predicted outcome: all five must qualify.</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 504.96)"/>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 524.8505)">A paper name or keyword is insufficient.</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 541.6505)">Missing matching review is not a miss.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="532.8" y="642.077813" transform="rotate(-0 532.8 642.077813)">Combine only after individual review</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 676.0505)">Essay / design item = Q2</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 693.04125)">Research item = 60 × Hit@1 + 0.40 × Q2</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e35" x="532.8" y="800.477813" transform="rotate(-0 532.8 800.477813)">Report with complete denominators</text>
   </g>
   <g id="text_21">
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 834.4505)">Total = 20% essay + 30% design + 50% research</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 851.2505)">Ten items per category. No prorating missing answers.</text>
    <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(532.8 868.0505)">Show cost, response time and visible explanation separately.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(39.6 876.007156)">¹ Molecular, biochemical and circuit experiments.</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(39.6 891.457156)">Methods planning applies across all four domains.</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #5f746d" transform="translate(39.6 906.907156)">Exact applicability and exceptions are in the English rubric.</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5f746d" x="39.6" y="925.2" transform="rotate(-0 39.6 925.2)">Single unblinded Codex referee · no API judge · no hidden chain of thought · incomplete comparisons are not full rankings</text>
   </g>
  </g>
 </g>
