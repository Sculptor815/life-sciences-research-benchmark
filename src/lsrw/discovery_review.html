<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发现过程 · 生命科学题库审核</title>
<style>body{font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif;background:#f2f5f4;color:#163a36;margin:0}header,main{max-width:1200px;margin:auto;padding:26px}header{padding-bottom:12px}h1{font-size:30px;margin:5px 0}h2{font-size:23px}h3{font-size:18px}p{margin:10px 0}.muted{color:#627570}nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;align-items:center}input,select,button,textarea{font:inherit;border:1px solid #b8cbc5;border-radius:6px;padding:8px;background:white;color:inherit}button{cursor:pointer;background:#e0eee8}textarea{width:96%;min-height:70px}article{background:white;border:1px solid #d5e2dc;border-radius:12px;padding:24px;margin:20px 0}.tag{background:#eaf3ee;padding:3px 9px;border-radius:20px;font-size:13px;display:inline-block;margin:4px}details{margin:12px 0;padding:10px;background:#f7f9f8}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 system-ui}a{color:#14695d}.notice{border-left:4px solid #bd8a25;padding:12px;background:#fff8e8}.question{border-top:1px solid #d8e5df;padding:12px 0}label{display:inline-block;margin:7px}#status{font-weight:600}footer{padding:30px;text-align:center;color:#627570}.row{display:flex;gap:10px;flex-wrap:wrap}</style>
<header><div class="muted">Life Sciences Research Workbench · 私有研究资料</div><h1>从发现过程构建评测题</h1><p>教科书概念 → 原始研究问题 → 实验与证据 → 替代解释 → 候选题与参考答案</p><p class="notice">所有内容均为待人工审核草稿。主题对应不等于已核实教材实际引用；摘要核查不等于阅读全文。保留候选题仅代表选题意向，正式入库还需独立双人审核、完整证据包和评分校准。</p><div id="summary"></div><nav><input id="query" placeholder="搜索概念、论文、问题" size="30"><select id="domain"><option value="">全部领域</option><option value="molecular_biology">分子生物学</option><option value="biochemistry">生物化学</option><option value="neuroscience">神经科学</option><option value="bioinformatics">生物信息学</option></select><select id="filter"><option value="">全部状态</option><option value="pending">未审核</option><option value="retain">保留</option><option value="revise">修改</option><option value="reject">剔除</option></select><input id="reviewer" placeholder="审核者姓名或代号"><button id="download">导出审核记录</button></nav><p id="status"></p><details><summary>教材、章节覆盖及检索缺口</summary><div id="books"></div></details></header><main id="cases"></main><footer>页面完全在本地运行，不请求外部脚本。审核意见保存在本浏览器；请导出 JSON 保存正式记录。</footer>
<script id="data" type="application/json">__CORPUS_JSON__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent), key='lsrw-review-'+D.sha256;
const names={molecular_biology:'分子生物学',biochemistry:'生物化学',neuroscience:'神经科学',bioinformatics:'生物信息学'};
const abilities={knowledge:'知识判断',experimental_design:'实验设计',research_reasoning:'研究推理',paper_appraisal:'论文评析'};
const depths={full_text:'主文已读',full_text_sections:'原文部分段落',abstract_and_captions:'摘要与部分图注',abstract_or_secondary:'摘要或二手资料'};
const checks={source_read:'我已核对原始来源',question_fair:'题目和材料足以公平作答',answer_checked:'我已核对参考答案',rights_checked:'材料使用权已检查'};
let saved={reviewer:'',decisions:{}};try{const value=JSON.parse(localStorage.getItem(key));if(value&&typeof value.reviewer==='string'&&value.decisions&&typeof value.decisions==='object'&&!Array.isArray(value.decisions))saved=value;}catch(e){}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const repr=x=>typeof x==='string'?x:JSON.stringify(x,null,2);
const block=(title,value)=>value&&(typeof value!=='object'||Object.keys(value).length)?'<details><summary>'+esc(title)+'</summary><pre>'+esc(repr(value))+'</pre></details>':'';
const link=url=>/^https?:\/\//i.test(url||'')?'<a target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">打开来源</a>':'来源链接待核实';
const $$=id=>document.getElementById(id);
$$('reviewer').value=saved.reviewer||'';
$$('summary').textContent=D.audit.cases+' 个发现案例 · '+D.audit.questions+' 道候选题 · 正式批准 0';
const qualityNames={importance:'重要性',evidence_grounding:'证据依据',novelty:'有界新颖性',testability:'可检验性',discrimination:'区分解释',feasibility:'可行性'};
const proposals=D.corpus.research_proposals||[];
if(proposals.length){const section=document.createElement('details');section.innerHTML='<summary>'+proposals.length+' 个后续研究方向与问题质量初评</summary><p class="notice">这些是待审核提案，部分属于复现或边界扩展。未完成有界文献检视，新颖性与正式总分均待定。五维描述分不用于排名。可将问题编号和修改意见记在下方对应发现案例的审核备注里。</p>'+proposals.map(p=>'<article><span class="tag">'+esc(names[p.domain])+'</span><h3>'+esc(p.question_zh)+'</h3><p class="muted">'+esc(p.id)+' · 来源案例 '+esc((p.source_case_ids||[]).join(', '))+'</p>'+block('证据起点与边界',{claim:p.foundation_claim,limits:p.strength_and_limits})+block('为什么值得回答',p.why_it_matters)+block('竞争解释与不同预测',{hypotheses:p.competing_hypotheses,predictions:p.predictions_by_hypothesis})+block('判别实验',p.discriminating_experiment)+block('阴性结果也能回答什么',p.negative_result_value)+block('伪影与可行性',{controls:p.artifact_controls,limits:p.feasibility_limits})+block('参考研究方案（允许其他好方案）',p.reference_answer)+'<h3>逐维初评</h3>'+Object.entries(qualityNames).map(([k,n])=>{const s=p.preliminary_scores?.[k];return '<p><b>'+n+'：</b>'+esc(s&&Number.isInteger(s.score)?s.score+'/4':'待定')+' '+esc(s?.rationale||'需要完成文献检视')+'</p>'}).join('')+'<p>五维描述分：'+esc(p.quality_summary?.partial_score??'待定')+'/20；正式总分：待定</p>'+block('新颖性与复核记录',{novelty:p.novelty_status,risks:p.novelty_risk_notes,qa:p.editorial_qa||p.qa_changes||p.revision_notes})+'</article>').join('')+block('评分规范与0–4锚点',D.corpus.question_quality_rubric);$$('summary').after(section);}
$$('books').innerHTML='<p>核心教材要求学校官方课程采用证据；版本、学期、必读与推荐分开核实。开放教材只作补充。</p>'+block('学校课程与教材采用原始记录',D.corpus.textbooks)+'<details><summary>80项概念检索计划（不等于已完成案例）</summary>'+((D.corpus.concepts||[]).map(c=>'<p><span class="tag">'+esc(names[c.domain])+'</span><b>'+esc(c.concept_zh||c.concept_en)+'</b><br>'+esc(c.importance_rationale||'')+'</p>').join(''))+'</details>'+block('逐章参考文献检索记录',D.corpus.bibliography_summary)+block('当前缺口',D.corpus.coverage_gaps);
function persist(){saved.reviewer=$$('reviewer').value;try{localStorage.setItem(key,JSON.stringify(saved));$$('status').textContent='本浏览器已保存 '+Object.keys(saved.decisions).length+' 条草稿意见；请导出以备份。';}catch(e){$$('status').textContent='浏览器无法持久保存，请立即导出记录。';}}
function render(){const query=$$('query').value.toLowerCase(),domain=$$('domain').value,filter=$$('filter').value;
const cases=D.corpus.cases.filter(c=>(!domain||c.domain===domain)&&(!query||JSON.stringify(c).toLowerCase().includes(query))&&(!filter||(saved.decisions[c.id]?.decision||'pending')===filter));
$$('cases').innerHTML=cases.map(c=>{const s=saved.decisions[c.id]||{},p=c.paper;
return '<article data-id="'+esc(c.id)+'"><span class="tag">'+esc(names[c.domain])+'</span><span class="tag">证据阅读：'+esc(depths[p.read_depth]||p.read_depth)+'</span><h2>'+esc(c.concept_zh||c.concept_en||c.id)+'</h2><p>'+esc(p.title)+' '+link(p.url)+'</p>'+block('教材映射及引文核验状态',c.textbook_mapping)+block('最初的问题与问题来源',c.original_question)+block('选题价值与历史重构的边界',c.question_origin)+block('实验如何区分假说',c.experimental_design)+block('原研究观察与证据位置',{summary:c.findings_summary,location:p.evidence_location,reading_scope:p.reported_read_depth||p.read_depth})+block('结论边界',c.inference_limits)+block('可能的伪影、替代解释与鉴别实验',c.artifacts)+block('发现链与补充说明',c.discovery_chain||c.additional_evidence)+block('原始来源与复核证据',c.evidence)+block('争议、作者回应与撤稿状态（逐项区分）',c.controversy)+block('本轮核查及修订记录',c.editorial_qa)+
'<h3>候选评测题</h3>'+c.questions.map(q=>'<div class="question"><b>'+esc(abilities[q.ability])+'</b><p>'+esc(q.prompt)+'</p>'+block('选项',q.choices)+block('固定材料草稿',q.candidate_packet)+block('参考答案（待核验）',q.reference_answer)+block('评分要点',q.scoring_points)+'</div>').join('')+
'<h3>你的审核</h3><div class="row"><select class="decision"><option value="pending">未决定</option>'+['retain','revise','reject'].map((v,i)=>'<option value="'+v+'" '+(s.decision===v?'selected':'')+'>'+['保留候选','需修改','剔除'][i]+'</option>').join('')+'</select></div><div>'+Object.entries(checks).map(([k,v])=>'<label><input type="checkbox" data-check="'+k+'" '+(s.checks?.[k]?'checked':'')+'>'+v+'</label>').join('')+'</div><textarea class="notes" placeholder="请写出保留、修改或剔除的具体理由">'+esc(s.notes||'')+'</textarea><p class="muted">案例 '+esc(c.id)+'；尚未分配公开/保留集，同一发现链应保持同一分组。</p></article>'}).join('');
}
function saveArticle(e){const a=e.target.closest('article');if(!a)return;const id=a.dataset.id,decision=a.querySelector('.decision').value;saved.decisions[id]={case_id:id,case_sha256:D.case_hashes[id],decision,notes:a.querySelector('.notes').value,checks:Object.fromEntries([...a.querySelectorAll('[data-check]')].map(x=>[x.dataset.check,x.checked]))};persist();}
$$('cases').addEventListener('input',saveArticle);$$('cases').addEventListener('change',saveArticle);
for(const id of ['query','domain','filter'])$$(id).addEventListener('input',render);
$$('reviewer').addEventListener('change',persist);
$$('download').addEventListener('click',()=>{persist();const decisions=Object.values(saved.decisions).filter(d=>['retain','revise','reject'].includes(d.decision));if(!saved.reviewer.trim()||!decisions.length||decisions.some(d=>!d.notes.trim()||(d.decision==='retain'&&!Object.values(d.checks).every(Boolean)))){alert('请填写审核者、每条意见的理由；保留候选须完成四项检查。');return;}const payload={schema_version:'1.0',corpus_sha256:D.sha256,reviewer:saved.reviewer,exported_at:new Date().toISOString(),decisions};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='research-review-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});render();
</script></html>
