[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "life-sciences-research-workbench"
version = "0.3.0"
description = "Reproducible evaluations of biological knowledge and research judgment"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
runtime = ["inspect-ai>=0.3.150,<0.4"]
review = ["streamlit>=1.40,<2"]
dev = ["build>=1.2"]
analysis = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "statsmodels>=0.14", "scanpy>=1.10", "anndata>=0.10"]

[project.scripts]
lsrw = "lsrw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lsrw = ["*.html"]
